<li class="news-item"><time datetime="{{ include.item.date | date: '%Y-%m-%d' }}">{{ include.item.date | date: "%b %Y" }}</time> <span class="news-title">{% if include.item.link %}<a href="{{ include.item.link }}">{{ include.item.title }}</a>{% else %}{{ include.item.title }}{% endif %}</span>{% if include.item.text %}<div class="news-text">{{ include.item.text | markdownify }}</div>{% endif %}</li>
