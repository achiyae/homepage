title: "Dr. Achiya Elyasaf"
url: "https://achiya.elyasaf.net"
baseurl: ""

exclude:
  - .superpowers
  - .claude
  - docs
  - test
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - vendor
  - _site_base

nav:
  - { title: "Home", url: "/" }
  - { title: "Biography", url: "/biography/" }
  - { title: "Research", url: "/research/" }
  - { title: "Lab", url: "/lab/" }
  - { title: "Publications", url: "/publications/" }
  - { title: "Grants & Awards", url: "/grants-awards/" }

social:
  - { name: "X", url: "https://x.com/AElyasaf", icon: "twitter" }
  - { name: "LinkedIn", url: "https://www.linkedin.com/in/achiyae/", icon: "linkedin" }
  - { name: "ORCID", url: "https://orcid.org/0000-0002-4009-5353", icon: "orcid" }
  - { name: "Google Scholar", url: "https://scholar.google.co.il/citations?hl=en&user=EBx5rKoAAAAJ", icon: "google-scholar" }
  - { name: "dblp", url: "https://dblp.org/pid/87/7184.html", icon: "dblp" }

plugins:
  - jekyll-scholar

scholar:
  source: ./_bibliography
  bibliography: publications.bib
  # jekyll-scholar treats this as a template string (or a layout name), so it includes the real template.
  bibliography_template: "{% include bib-entry.html %}"
  # bib-entry.html emits its own <li class="pub">; publications.md strips this placeholder wrapper.
  bibliography_item_tag: bib-item
  sort_by: year,month
  order: descending
  # No group_by: native grouping emits a bare heading + list with no section wrapper, so publications.md groups by year itself.
  bibtex_filters: [latex, smallcaps, superscript]
